      - {name: Reuters Saudi, type: google_news, query: "site:reuters.com Saudi Arabia (China OR deal OR investment OR acquisition OR joint venture OR IPO)", tier: 2, category: media, max_items: 15}
      - {name: Bloomberg Saudi, type: google_news, query: "site:bloomberg.com Saudi Arabia (China OR deal OR investment OR acquisition OR joint venture OR IPO)", tier: 2, category: media, max_items: 12}
      - {name: MEED Saudi, type: google_news, query: "site:meed.com Saudi (project OR contract OR award OR financial close OR investment)", tier: 2, category: media, max_items: 12}
      - {name: AGBI Saudi, type: google_news, query: "site:agbi.com Saudi (investment OR acquisition OR project OR contract OR China)", tier: 2, category: media, max_items: 12}
