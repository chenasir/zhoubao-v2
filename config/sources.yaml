# V2 source registry.
# tier 1 = official / exchange / regulator; tier 2 = authoritative media;
# tier 3 = discovery / Chinese outbound media; category is shown in the UI.
# Dead direct RSS endpoints from V1 were replaced with Google News site queries.

countries:
  - code: KSA
    name_en: Saudi Arabia
    name_zh: 沙特阿拉伯
    sources:
      - {name: Arab News, type: rss, url: "https://www.arabnews.com/rss.xml", tier: 2, category: media, max_items: 20}
      - {name: Saudi Press Agency, type: google_news, query: "site:spa.gov.sa/en Saudi (China OR Chinese) (investment OR agreement OR project OR contract OR acquisition)", tier: 1, category: official, max_items: 15}
      - {name: PIF News, type: google_news, query: "site:pif.gov.sa/en/news-and-insights Saudi (investment OR acquisition OR MoU OR joint venture OR fund)", tier: 1, category: sovereign_fund, max_items: 15}
      - {name: Ministry of Investment, type: google_news, query: "site:misa.gov.sa Saudi investment (China OR agreement OR project OR partnership)", tier: 1, category: official, max_items: 12}
      - {name: Saudi CMA, type: google_news, query: "site:cma.gov.sa/en/MediaCenter (approval OR offering OR acquisition OR merger OR foreign investor)", tier: 1, category: regulator, max_items: 12}
      - {name: Saudi Exchange, type: google_news, query: "site:saudiexchange.sa (IPO OR listing OR acquisition OR merger OR agreement OR investment)", tier: 1, category: exchange, max_items: 12}
